{% extends 'Adminstrator/Header.html' %}
{% load static %}
{% block content %}
<style>

    body{
        font-family: 'Poppins', sans-serif;
        background: #f4f7fc;
        margin: 0;
        padding: 0;
    }

    .container{
        width: 90%;
        max-width: 900px;
        margin: 40px auto;
    }

    .page-title{
        text-align: center;
        font-size: 34px;
        font-weight: 700;
        color: #1e293b;
        margin-bottom: 30px;
    }

    .form-card,
    .table-card{
        background: #ffffff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        margin-bottom: 30px;
    }

    .form-table,
    .details-table{
        width: 100%;
        border-collapse: collapse;
    }

    .form-table td{
        padding: 15px;
        font-size: 16px;
    }

    textarea{
        width: 100%;
        min-height: 120px;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
        resize: none;
        outline: none;
        transition: 0.3s;
    }

    textarea:focus{
        border-color: #2563eb;
        box-shadow: 0 0 5px rgba(37,99,235,0.3);
    }

    .btn-group{
        text-align: center;
    }

    .submit-btn{
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
        font-weight: 500;
    }

    .submit-btn:hover{
        background: #1d4ed8;
    }

    .section-title{
        text-align: center;
        font-size: 26px;
        color: #1e293b;
        margin-bottom: 20px;
        font-weight: 600;
    }

    .details-table th{
        background: #2563eb;
        color: white;
        padding: 14px;
        font-size: 15px;
        text-align: center;
    }

    .details-table td{
        padding: 14px;
        text-align: center;
        border-bottom: 1px solid #e5e7eb;
        font-size: 14px;
    }

    .details-table tr:hover{
        background: #f8fafc;
    }

    .status{
        color: #10b981;
        font-weight: 600;
    }

    @media(max-width:768px){

        .form-table td{
            display: block;
            width: 100%;
        }

        .details-table{
            display: block;
            overflow-x: auto;
        }

        .page-title{
            font-size: 28px;
        }
    }

</style>

<div class="container">

    <h2 class="page-title">Reply Feedback</h2>

    <form method="post">

        {% csrf_token %}

        <div class="form-card">

            <table class="form-table">

                <tr>

                    <td><strong>Reply</strong></td>

                    <td>
                        <textarea name="txt_reply"
                                  required
                                  placeholder="Enter Your Reply"></textarea>
                    </td>

                </tr>

                <tr>

                    <td colspan="2">

                        <div class="btn-group">

                            <input type="submit"
                                   name="btn_submit"
                                   value="Submit"
                                   class="submit-btn">

                        </div>

                    </td>

                </tr>

            </table>

        </div>

        <div class="table-card">

            <h2 class="section-title">Reply Details</h2>

            <table class="details-table">

                <tr>
                    <th>Sl.No</th>
                    <th>Reply</th>
                    <th>Status</th>
                </tr>

                {% for i in feedback %}

                <tr>

                    <td>{{forloop.counter}}</td>

                    <td>{{i.feedback_reply}}</td>

                    <td class="status">Replied</td>

                </tr>

                {% endfor %}

            </table>

        </div>

    </form>

</div>
{% endblock content %}
