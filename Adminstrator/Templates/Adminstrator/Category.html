{% extends 'Adminstrator/Header.html' %}
{% load static %}
{% block content %}
<style>
    body{
        font-family: 'Poppins', sans-serif;
        background: #f4f7fc;
    }

    .category-container{
        width: 90%;
        max-width: 900px;
        margin: 40px auto;
    }

    .page-title{
        text-align: center;
        color: #1e293b;
        margin-bottom: 25px;
        font-size: 32px;
        font-weight: 600;
    }

    .form-card,
    .table-card{
        background: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        margin-bottom: 30px;
    }

    .form-table,
    .details-table{
        width: 100%;
        border-collapse: collapse;
    }

    .form-table td{
        padding: 15px;
        font-size: 16px;
    }

    .details-table th,
    .details-table td{
        padding: 14px;
        border-bottom: 1px solid #e5e7eb;
        text-align: center;
    }

    .details-table th{
        background: #2563eb;
        color: white;
        font-size: 16px;
    }

    input[type="text"]{
        width: 100%;
        padding: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
    }

    input[type="text"]:focus{
        border-color: #2563eb;
        box-shadow: 0 0 5px rgba(37,99,235,0.3);
    }

    .btn-group{
        text-align: center;
        margin-top: 10px;
    }

    .btn{
        padding: 10px 22px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
        margin: 5px;
        color: white;
        font-weight: 500;
    }

    .submit-btn{
        background: #2563eb;
    }

    .submit-btn:hover{
        background: #1d4ed8;
    }

    .reset-btn{
        background: #ef4444;
    }

    .reset-btn:hover{
        background: #dc2626;
    }

    .action-btn{
        text-decoration: none;
        padding: 7px 14px;
        border-radius: 6px;
        color: white;
        font-size: 14px;
        margin: 2px;
        display: inline-block;
    }

    .edit-btn{
        background: #10b981;
    }

    .edit-btn:hover{
        background: #059669;
    }

    .delete-btn{
        background: #ef4444;
    }

    .delete-btn:hover{
        background: #dc2626;
    }

    .section-title{
        text-align: center;
        color: #1e293b;
        margin-bottom: 20px;
        font-size: 26px;
        font-weight: 600;
    }

    @media(max-width:768px){

        .form-table td{
            display: block;
            width: 100%;
        }

        .details-table{
            display: block;
            overflow-x: auto;
        }
    }
</style>

<div class="category-container">

    <h2 class="page-title">Category Management</h2>

    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <table class="form-table">
                <tr>
                    <td><strong>Category Name</strong></td>
                    <td>
                        <input type="text"
                               name="txt_category"
                               required
                               placeholder="Enter Your Category Name"
                               value="{{editdata.Category_name}}">
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <div class="btn-group">
                            <input type="submit" value="Submit" class="btn submit-btn">
                            <input type="reset" value="Cancel" class="btn reset-btn">
                        </div>
                    </td>
                </tr>
            </table>
        </form>
    </div>

    <div class="table-card">

        <h2 class="section-title">Category Details</h2>

        <table class="details-table">
            <tr>
                <th>Sl.No</th>
                <th>Category</th>
                <th>Action</th>
            </tr>

            {% for i in category %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{i.Category_name}}</td>
                <td>
                    <a href="{% url 'Admin:deletecategory' i.id %}"
                       class="action-btn delete-btn">
                       Delete
                    </a>

                    <a href="{% url 'Admin:categoryedit' i.id %}"
                       class="action-btn edit-btn">
                       Edit
                    </a>
                </td>
            </tr>
            {% endfor %}
        </table>

    </div>

</div>
{% endblock content %}
