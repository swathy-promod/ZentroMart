{% extends 'User/Header.html' %}
{% load static %}
{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            background: #f4f6f9;
        }

        .edit-container{
            width: 100%;
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .edit-card{
            width: 500px;
            background: #fff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .edit-title{
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 30px;
        }

        table{
            width: 100%;
        }

        td{
            padding: 12px 0;
            vertical-align: top;
        }

        td:first-child{
            width: 30%;
            font-weight: 600;
            color: #111827;
        }

        input[type="text"],
        textarea{
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            background: #fafafa;
            font-size: 15px;
            transition: 0.3s;
        }

        input[type="text"]:focus,
        textarea:focus{
            border-color: #2563eb;
            background: #fff;
            box-shadow: 0 0 5px rgba(37,99,235,0.4);
        }

        textarea{
            resize: none;
            height: 100px;
        }

        .btn-box{
            text-align: center;
            padding-top: 20px;
        }

        .submit-btn{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover{
            background: #2563eb;
        }

        @media(max-width: 600px){

            .edit-card{
                width: 100%;
                padding: 25px;
            }

            .edit-title{
                font-size: 26px;
            }

            td{
                display: block;
                width: 100%;
                padding: 8px 0;
            }

            td:first-child{
                padding-top: 15px;
            }
        }

    </style>

</head>

<body>

    <div class="edit-container">

        <div class="edit-card">

            <h1 class="edit-title">Edit Profile</h1>

            <form method="post">
                {% csrf_token %}

                <table>

                    <tr>
                        <td>Name</td>

                        <td>
                            <input type="text"
                                   name="txt_name"
                                   value="{{user.user_name}}"
                                   required
                                   placeholder="Enter name">
                        </td>
                    </tr>

                    <tr>
                        <td>Email</td>

                        <td>
                            <input type="text"
                                   name="txt_email"
                                   value="{{user.user_email}}"
                                   required
                                   placeholder="Enter email">
                        </td>
                    </tr>

                    <tr>
                        <td>Contact</td>

                        <td>
                            <input type="text"
                                   name="txt_contact"
                                   value="{{user.user_contact}}"
                                   required
                                   placeholder="Enter contact number">
                        </td>
                    </tr>

                    <tr>
                        <td>Address</td>

                        <td>
                            <textarea name="address"
                                      placeholder="Enter address">{{user.user_address}}</textarea>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" class="btn-box">

                            <input type="submit"
                                   name="txt_edit"
                                   value="Update Profile"
                                   class="submit-btn">

                        </td>
                    </tr>

                </table>

            </form>

        </div>

    </div>

</body>

</html>

{% endblock content %}
