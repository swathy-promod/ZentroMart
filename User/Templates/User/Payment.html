<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f6f9;
            font-family: Arial, Helvetica, sans-serif;
        }

        .payment-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .payment-card {
            width: 450px;
            background: #fff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.15);
        }

        .payment-card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0px 0px 6px rgba(0, 123, 255, 0.4);
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .amount-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #28a745;
            margin-bottom: 25px;
        }

        .amount-box h3 {
            margin: 0;
            color: #333;
            font-size: 18px;
        }

        .amount-box p {
            margin-top: 8px;
            font-size: 24px;
            font-weight: bold;
            color: #28a745;
        }

        .pay-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .pay-btn:hover {
            background: #0056b3;
        }

        @media(max-width: 550px) {

            .payment-card {
                width: 90%;
                padding: 25px;
            }

            .row {
                flex-direction: column;
            }
        }
    </style>

</head>

<body>

    <div class="payment-container">

        <form method="post" class="payment-card">

            {% csrf_token %}

            <h2>Payment</h2>

            <div class="form-group">
                <label>Account Number</label>

               <input type="text"
       name="txt_acc"
       id="credit-card"
       required
       placeholder="XXXX XXXX XXXX XXXX"
       pattern="[0-9 ]{19}"
       minlength="19"
       maxlength="19"
       title="Enter a valid 16-digit card number">
            </div>

            <div class="form-group">
                <label>Card Holder Name</label>

                <input type="text" name="txt_name"  required placeholder="Enter Your Name" autocomplete="off" pattern="[A-Za-z ]{3,30}"
title="Only letters and spaces allowed">
            </div>

            <div class="row">

                <div class="form-group">
                    <label>Expiry Date</label>

                   <input type="text"
       name="txt_exp"
       id="credit-card-exp"
       required
       placeholder="MM/YY"
       pattern="^(0[1-9]|1[0-2])\/[0-9]{2}$"
       title="Enter expiry date in MM/YY format">
                </div>

                <div class="form-group">
                    <label>CCV</label>

                    <input type="password"
       name="txt_ccv"
       id="credit-card-ccv"
       required
       placeholder="CVV"
       pattern="[0-9]{3}"
       minlength="3"
       maxlength="3"
       title="Enter a valid 3-digit CVV">
                </div>

            </div>

            <div class="amount-box">

                <h3>Total Amount</h3>

                <p>₹ {{amt}}</p>

            </div>

            <input type="submit" name="payment" value="Pay Now" class="pay-btn">

        </form>

    </div>

</body>

</html>

<script src="https://cdnjs.cloudflare.com/ajax/libs/inputmask/5.0.6/jquery.inputmask.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
      const creditCardInput = document.getElementById("credit-card");
      const creditCardExp = document.getElementById("credit-card-exp");
      const creditCardCcv = document.getElementById("credit-card-ccv");
  
      creditCardInput.addEventListener("input", function() {
        const inputValue = this.value.replace(/\D/g, ''); // Remove all non-digits
        const formattedValue = formatCreditCard(inputValue);
        this.value = formattedValue;
      });
  
      creditCardExp.addEventListener("input", function() {
        const inputValue = this.value.replace(/\D/g, ''); // Remove all non-digits
        const formattedValue = formatExpirationDate(inputValue);
        this.value = formattedValue;
      });
  
      creditCardCcv.addEventListener("input", function() {
        const inputValue = this.value.replace(/\D/g, ''); // Remove all non-digits
        const formattedValue = formatCVV(inputValue);
        this.value = formattedValue;
      });
    });
  
    function formatCreditCard(value) {
      const groups = value.match(/(\d{1,4})/g) || [];
      return groups.join(' ');
    }
  
    function formatExpirationDate(value) {
      const groups = value.match(/(\d{1,2})/g) || [];
      return groups.join('/').slice(0, 5);
    }
  
    function formatCVV(value) {
      return value.slice(0, 3);
    }
  </script>
