{% extends 'Seller/Header.html' %}
{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body{
            background: #f4f6f9;
        }

        .password-container{
            width: 100%;
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .password-card{
            width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .password-title{
            text-align: center;
            font-size: 32px;
            color: #111827;
            margin-bottom: 30px;
            font-weight: 600;
        }

        table{
            width: 100%;
        }

        td{
            padding: 12px 0;
        }

        td:first-child{
            width: 35%;
            font-weight: 600;
            color: #111827;
        }

        input[type="password"]{
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            background: #fafafa;
            font-size: 15px;
            transition: 0.3s;
        }

        input[type="password"]:focus{
            border-color: #2563eb;
            background: #fff;
            box-shadow: 0 0 5px rgba(37,99,235,0.4);
        }

        .btn-box{
            text-align: center;
            padding-top: 20px;
        }

        .btn{
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.3s;
            margin: 5px;
        }

        .submit-btn{
            background: #111827;
            color: white;
        }

        .submit-btn:hover{
            background: #2563eb;
        }

        .reset-btn{
            background: #e5e7eb;
            color: #111827;
        }

        .reset-btn:hover{
            background: #d1d5db;
        }

        @media(max-width: 500px){

            .password-card{
                width: 100%;
                padding: 25px;
            }

            .password-title{
                font-size: 26px;
            }

            td{
                display: block;
                width: 100%;
            }

            td:first-child{
                padding-bottom: 5px;
            }

            .btn{
                width: 100%;
            }
        }

    </style>

</head>

<body>

    <div class="password-container">

        <div class="password-card">

            <h1 class="password-title">Change Password</h1>
            <form method="post">
                {% csrf_token %}

                <table>

                    <tr>
                        <td>Old Password</td>
                        <td>
                            <input type="password"
                                   name="txt_opass"
                                   required
                                   placeholder="Enter old password">
                        </td>
                    </tr>

                    <tr>
                        <td>New Password</td>
                        <td>
                            <input type="password"
                                   name="txt_npass"
                                   required
                                   placeholder="Enter new password">
                        </td>
                    </tr>

                    <tr>
                        <td>Retype Password</td>
                        <td>
                            <input type="password"
                                   name="txt_rpass"
                                   required
                                   placeholder="Retype password">
                        </td>
                    </tr>

                    <tr>
                        <td colspan="2" class="btn-box">

                            <input type="submit"
                                   name="btn_submit"
                                   value="Change Password"
                                   class="btn submit-btn">

                            <input type="reset"
                                   name="btn_reset"
                                   value="Cancel"
                                   class="btn reset-btn">

                        </td>
                    </tr>

                </table>

            </form>

        </div>

    </div>

</body>

</html>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location = "{% url 'Seller:changepassword' %}"
</script>
{% endif %}

{% endblock content %}
