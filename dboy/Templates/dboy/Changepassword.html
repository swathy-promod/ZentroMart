{% extends 'dboy/Header.html' %}
{% load static %}
{% block content %}

<style>

    body{
        background: #f4f6f9;
        font-family: Arial, Helvetica, sans-serif;
    }

    .password-container{
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 80px 0;
    }

    .password-box{
        width: 420px;
        background: #fff;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0px 5px 20px rgba(0,0,0,0.15);
    }

    .password-box h2{
        text-align: center;
        margin-bottom: 25px;
        color: #333;
        font-size: 28px;
    }

    .form-group{
        margin-bottom: 20px;
    }

    .form-group label{
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
    }

    .form-group input{
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
    }

    .form-group input:focus{
        border-color: #007bff;
        outline: none;
        box-shadow: 0px 0px 6px rgba(0,123,255,0.4);
    }

    .btn-group{
        display: flex;
        justify-content: space-between;
        margin-top: 25px;
    }

    .btn-submit,
    .btn-reset{
        width: 48%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-submit{
        background: #007bff;
        color: white;
    }

    .btn-submit:hover{
        background: #0056b3;
    }

    .btn-reset{
        background: #dc3545;
        color: white;
    }

    .btn-reset:hover{
        background: #a71d2a;
    }

    @media(max-width: 500px){

        .password-box{
            width: 90%;
            padding: 25px;
        }

        .btn-group{
            flex-direction: column;
        }

        .btn-submit,
        .btn-reset{
            width: 100%;
            margin-bottom: 10px;
        }
    }

</style>

<div class="password-container">

    <form method="post" class="password-box">

        {% csrf_token %}

        <h2>Change Password</h2>

        <div class="form-group">
            <label>Old Password</label>
            <input type="password"
                   name="txt_opass"
                   placeholder="Enter Old Password"
                   required>
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password"
                   name="txt_npass"
                   placeholder="Enter New Password"
                   required>
        </div>

        <div class="form-group">
            <label>Retype Password</label>
            <input type="password"
                   name="txt_rpass"
                   placeholder="Retype New Password"
                   required>
        </div>

        <div class="btn-group">
            <input type="submit"
                   name="btn_submit"
                   value="Change Password"
                   class="btn-submit">

            <input type="reset"
                   name="btn_reset"
                   value="Cancel"
                   class="btn-reset">
        </div>

    </form>

</div>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'dboy:changepassword' %}"
</script>
{% endif %}

{% endblock content %}
