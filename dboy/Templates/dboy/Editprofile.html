{% extends 'dboy/Header.html' %}
{% load static %}
{% block content %}

<style>

    body{
        background: #f4f6f9;
        font-family: Arial, Helvetica, sans-serif;
    }

    .profile-container{
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 70px 0;
    }

    .profile-box{
        width: 450px;
        background: #fff;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0px 5px 20px rgba(0,0,0,0.15);
    }

    .profile-box h2{
        text-align: center;
        margin-bottom: 25px;
        color: #333;
        font-size: 28px;
    }

    .form-group{
        margin-bottom: 20px;
    }

    .form-group label{
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
    }

    .form-group input,
    .form-group textarea{
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
    }

    .form-group textarea{
        resize: none;
        height: 100px;
    }

    .form-group input:focus,
    .form-group textarea:focus{
        border-color: #007bff;
        outline: none;
        box-shadow: 0px 0px 6px rgba(0,123,255,0.4);
    }

    .submit-btn{
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }

    .submit-btn:hover{
        background: #0056b3;
    }

    @media(max-width: 500px){

        .profile-box{
            width: 90%;
            padding: 25px;
        }
    }

</style>

<div class="profile-container">

    <form method="post" class="profile-box">

        {% csrf_token %}

        <h2>Edit Profile</h2>

        <div class="form-group">
            <label>Name</label>
            <input type="text"
                   name="txt_n"
                   value="{{dboy.dboy_name}}"
                   required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="text"
                   name="txt_e"
                   value="{{dboy.dboy_email}}"
                   required>
        </div>

        <div class="form-group">
            <label>Contact</label>
            <input type="text"
                   name="txt_c"
                   value="{{dboy.dboy_contact}}"
                   required>
        </div>

        <div class="form-group">
            <label>Address</label>
            <textarea name="a" required>{{dboy.dboy_address}}</textarea>
        </div>

        <input type="submit"
               name="btn_edit"
               value="Update Profile"
               class="submit-btn">

    </form>

</div>

{% endblock content %}
