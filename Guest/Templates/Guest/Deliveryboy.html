{% extends 'Guest/Header.html' %}
{% load static %}
{% block content %}

<style>
    body{
        background: #f4f6f9;
        font-family: Arial, Helvetica, sans-serif;
    }

    .delivery-container{
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 60px 0;
    }

    .delivery-box{
        width: 500px;
        background: #fff;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0px 5px 20px rgba(0,0,0,0.15);
    }

    .delivery-box h2{
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .form-group{
        margin-bottom: 18px;
    }

    .form-group label{
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
    }

    .form-group input,
    .form-group select{
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus{
        border-color: #007bff;
        outline: none;
        box-shadow: 0px 0px 6px rgba(0,123,255,0.4);
    }

    .btn-group{
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }

    .btn-submit,
    .btn-reset{
        width: 48%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-submit{
        background: #007bff;
        color: white;
    }

    .btn-submit:hover{
        background: #0056b3;
    }

    .btn-reset{
        background: #dc3545;
        color: white;
    }

    .btn-reset:hover{
        background: #a71d2a;
    }

    @media(max-width: 600px){
        .delivery-box{
            width: 90%;
            padding: 25px;
        }

        .btn-group{
            flex-direction: column;
        }

        .btn-submit,
        .btn-reset{
            width: 100%;
            margin-bottom: 10px;
        }
    }
</style>

<div class="delivery-container">

    <form method="post" enctype="multipart/form-data" class="delivery-box">
        {% csrf_token %}

        <h2>Delivery Boy Registration</h2>

        <div class="form-group">
            <label>Name</label>
            <input type="text" name="txt_n" required pattern="^[A-Z]+[a-zA-Z ]*$"
            title="Name Allows Only Alphabets, Spaces and First Letter Must Be Capital Letter">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="text" name="txt_e" required>
        </div>

        <div class="form-group">
            <label>Contact</label>
            <input type="text" name="txt_c" required
            pattern="[7-9]{1}[0-9]{9}"
            title="Phone number with 7-9 and remaining 9 digits with 0-9">
        </div>

        <div class="form-group">
            <label>Address</label>
            <input type="text" name="txt_a" required>
        </div>

        <div class="form-group">
            <label>Photo</label>
            <input type="file" name="pho" required accept="image/*">
        </div>

        <div class="form-group">
            <label>Proof</label>
            <input type="file" name="pro" required accept="image/*">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" required name="txt_pass"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
            title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters">
        </div>

        <div class="form-group">
            <label>District</label>
            <select name="sel_district" id="sel_district" required>
                <option value="">---Select District---</option>
                {% for i in district %}
                <option value="{{i.id}}">
                    {{ i.district_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Place</label>
            <select name="sel_place" id="sel_place" required>
                <option value="">---Select Place---</option>
            </select>
        </div>

        <div class="btn-group">
            <input type="submit" name="btn_submit" value="Submit" class="btn-submit">
            <input type="reset" name="btn_cancel" value="Cancel" class="btn-reset">
        </div>

    </form>

</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>
  $("#sel_district").change(function () {

    var did = $(this).val();
    var ur = "{% url 'Guest:ajaxplace' %}";

    $.ajax({
      url: ur,
      data: { did: did },

      success: function (data) {
        $("#sel_place").html(data);
      },
    });
  });
</script>

{% endblock content %}
